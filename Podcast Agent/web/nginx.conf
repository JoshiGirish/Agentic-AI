upstream agents {
    server agents:8000;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://agents;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_buffering off;
    }
}
