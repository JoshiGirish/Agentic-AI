services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - AGENTS_URL=http://agents:8000
      - LLM_URL=http://localhost:8080/v1
    depends_on:
      - agents
    networks:
      - podcast-network

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    environment:
      - LLM_URL=http://localhost:8080/v1
    networks:
      - podcast-network

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    networks:
      - podcast-network

networks:
  podcast-network:
    driver: bridge
